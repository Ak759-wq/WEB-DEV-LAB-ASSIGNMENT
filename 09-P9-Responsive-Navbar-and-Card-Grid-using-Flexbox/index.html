<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aditya - Flexbox navbar and card grid</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <span class="brand">Aditya</span>
    <div class="links">
      <a href="#">Home</a>
      <a href="#">Projects</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <main class="grid">
    <article class="card">
      <h3>SplitEasy</h3>
      <p>Bill-splitting app deployed on Google Cloud Run.</p>
    </article>
    <article class="card">
      <h3>SchoolScope</h3>
      <p>Aggregator for new-age tech colleges in India.</p>
    </article>
    <article class="card">
      <h3>Web-dev-lab</h3>
      <p>Lab exercises for terminal, Git, and HTML/CSS.</p>
    </article>
  </main>
</body>
</html>
